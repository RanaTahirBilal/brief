<style id="app-css">
/* ==========================================================
   THE BRIEF — client intake
   Set as a bound document, not a web form: front matter, a
   contents page, numbered sections, a colophon, and a print
   sheet she can fill in by hand. The restraint is the point;
   everything here is a rule, a counter or a piece of type.

   Newsreader is a variable face with an optical size axis.
   The masthead is set at opsz 72 where the face turns high
   contrast and narrow; the questions at opsz 20 where it
   stays open and readable. Same family, two different voices.
   ========================================================== */

:root{
    /* Surfaces: the page is a desk, the inputs are sheets on it. */
    --desk:#F3F1EC;
    --sheet:#FFFFFF;
    --ink:#14130F;
    --ink-2:#3A362E;
    --muted:#5E594F;
    --faint:#736D61;
    --rule:#D9D4C8;
    --rule-fine:#E7E2D7;

    --accent:#1F3D6B;
    --accent-soft:#E7ECF4;
    --flag:#8A3B18;
    --flag-soft:#F7EAE1;
    --ok:#2C6248;

    /* One type scale, used everywhere. */
    --s-xs:11px;
    --s-sm:12.5px;
    --s-md:15px;
    --s-base:16.5px;
    --s-lg:19.5px;
    --s-xl:clamp(24px,3.4vw,32px);
    --s-2xl:clamp(34px,6.6vw,64px);

    /* One spacing scale. */
    --sp-1:6px; --sp-2:12px; --sp-3:20px; --sp-4:32px;
    --sp-5:clamp(36px,5vw,56px); --sp-6:clamp(52px,8vw,96px);

    --serif:'Newsreader',Georgia,'Times New Roman',serif;
    --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

    --page:1200px;
    --gutter:clamp(20px,4.5vw,52px);
    --rail:220px;
}

@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --desk:#131210;
        --sheet:#1C1A16;
        --ink:#F2EEE5;
        --ink-2:#D6D0C4;
        --muted:#A9A294;
        --faint:#918A7C;
        --rule:#35312A;
        --rule-fine:#28241E;
        --accent:#A8C0E4;
        --accent-soft:#1E2532;
        --flag:#DE9A72;
        --flag-soft:#2B1F17;
        --ok:#7FBF9C;
    }
}
:root[data-theme="dark"]{
    --desk:#131210;
    --sheet:#1C1A16;
    --ink:#F2EEE5;
    --ink-2:#D6D0C4;
    --muted:#A9A294;
    --faint:#918A7C;
    --rule:#35312A;
    --rule-fine:#28241E;
    --accent:#A8C0E4;
    --accent-soft:#1E2532;
    --flag:#DE9A72;
    --flag-soft:#2B1F17;
    --ok:#7FBF9C;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }

body{
    margin:0; background:var(--desk); color:var(--ink);
    font-family:var(--sans); font-size:var(--s-base); line-height:1.65;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased; overflow-x:clip;
}

.page{ max-width:var(--page); margin:0 auto; padding:0 var(--gutter); }

/* Every uppercase label in the document, one class. */
.label{
    font-family:var(--mono); font-size:var(--s-xs); font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--faint);
}

/* ---------- running head ---------- */
.head{
    position:sticky; top:0; z-index:60;
    background:var(--desk); border-bottom:1px solid var(--rule);
}
.head-track{ height:2px; background:var(--rule-fine); }
.head-fill{ height:2px; width:0%; background:var(--accent); transition:width .4s ease; }
@media (prefers-reduced-motion: reduce){ .head-fill{ transition:none; } }
.head-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3);
    max-width:var(--page); margin:0 auto; padding:10px var(--gutter);
}
.head-row b{ color:var(--ink); font-weight:500; }

/* ---------- front matter ---------- */
.cover{ padding:var(--sp-6) 0 var(--sp-5); }
.masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    gap:var(--sp-3); flex-wrap:wrap;
    border-bottom:1px solid var(--ink); padding-bottom:var(--sp-2); margin-bottom:var(--sp-5);
}
h1{
    font-family:var(--serif); font-weight:300;
    font-variation-settings:'opsz' 72;
    font-size:var(--s-2xl); line-height:1.02; letter-spacing:-.025em;
    margin:0 0 var(--sp-4); max-width:16ch; text-wrap:balance;
}
.standfirst{
    font-family:var(--serif); font-variation-settings:'opsz' 28;
    font-size:clamp(18px,2.2vw,22px); line-height:1.55; color:var(--ink-2);
    margin:0 0 var(--sp-2); max-width:56ch;
}
.standfirst em{ font-style:italic; }

/* The spec table: front matter of a real document. */
.spec{ margin:var(--sp-5) 0 0; border-top:1px solid var(--rule); max-width:560px; }
.spec div{
    display:grid; grid-template-columns:130px 1fr; gap:var(--sp-3);
    padding:11px 0; border-bottom:1px solid var(--rule-fine);
}
.spec dt{ margin:0; }
.spec dd{ margin:0; font-size:var(--s-md); color:var(--ink); }

/* ---------- contents ---------- */
.contents{ padding:var(--sp-5) 0 var(--sp-6); border-top:1px solid var(--rule); }
.contents-h{ margin:0 0 var(--sp-3); }
.toc{ list-style:none; margin:0; padding:0; max-width:640px; }
.toc li{ border-bottom:1px solid var(--rule-fine); }
.toc a{
    display:grid; grid-template-columns:34px 1fr auto; gap:var(--sp-2); align-items:baseline;
    padding:11px 0; text-decoration:none; color:var(--ink);
}
.toc a:hover .toc-t{ text-decoration:underline; text-underline-offset:3px; }
.toc a:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.toc-n{ font-family:var(--mono); font-size:var(--s-sm); color:var(--faint); }
.toc-t{ font-family:var(--serif); font-variation-settings:'opsz' 20; font-size:18px; }
.toc-c{ font-family:var(--mono); font-size:var(--s-xs); color:var(--faint); }

/* ---------- body: rail + questions ---------- */
.shell{
    display:grid; grid-template-columns:var(--rail) minmax(0,1fr);
    gap:clamp(28px,5vw,80px); align-items:start;
    padding-bottom:var(--sp-5);
}
@media (max-width:960px){ .shell{ grid-template-columns:1fr; gap:0; } }

.rail{ position:sticky; top:62px; padding:var(--sp-5) 0 0; }
.rail-h{ margin:0 0 var(--sp-2); }
.rail ol{ list-style:none; margin:0; padding:0; }
.rail a{
    display:grid; grid-template-columns:10px 1fr; gap:11px; align-items:center;
    padding:5px 0 5px 13px; text-decoration:none; color:var(--muted);
    font-size:13.5px; line-height:1.35;
    border-left:1px solid var(--rule-fine);
}
.rail a:hover{ color:var(--ink); border-left-color:var(--rule); }
.rail a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.rail a[aria-current="true"]{ color:var(--ink); border-left-color:var(--accent); }
.rail .rn{ font-family:var(--mono); font-size:var(--s-xs); color:var(--faint); }
.rail a[aria-current="true"] .rn{ color:var(--accent); }

/* State marker: ring, half, solid. Real state, not ornament. */
.dot{ width:8px; height:8px; border-radius:50%; border:1px solid var(--rule); position:relative; }
.part .dot{ border-color:var(--accent); }
.part .dot::after{
    content:""; position:absolute; inset:1px; border-radius:50%;
    background:linear-gradient(to right,var(--accent) 50%,transparent 50%);
}
.full .dot{ border-color:var(--ok); background:var(--ok); }
.rail-key{ margin:var(--sp-3) 0 0; padding-top:var(--sp-2); border-top:1px solid var(--rule-fine); line-height:1.9; text-transform:none; letter-spacing:.02em; }

.jump{ display:none; margin:0 0 var(--sp-4); border:1px solid var(--rule); background:var(--sheet); }
.jump summary{ padding:13px 16px; cursor:pointer; list-style:none; color:var(--accent); }
.jump summary::-webkit-details-marker{ display:none; }
.jump summary::after{ content:"  +"; }
.jump[open] summary::after{ content:"  \2212"; }
.jump .rail{ position:static; padding:0 16px 14px; }
.jump .rail-h{ display:none; }
@media (max-width:960px){ .rail-desk{ display:none; } .jump{ display:block; } }

/* ---------- sections ---------- */
.qs{ padding-top:var(--sp-5); }
section{ scroll-margin-top:70px; padding:0 0 var(--sp-6); }
.sh{ border-top:1px solid var(--ink); padding-top:var(--sp-2); margin:0 0 var(--sp-1); }
.sh-row{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3); margin:0 0 var(--sp-2); }
h2{
    font-family:var(--serif); font-weight:400; font-variation-settings:'opsz' 40;
    font-size:var(--s-xl); line-height:1.14; letter-spacing:-.015em;
    margin:0 0 var(--sp-1); max-width:22ch; text-wrap:balance;
}
.sh-sub{ color:var(--muted); font-size:var(--s-md); margin:0; max-width:54ch; }
.sh-count{ white-space:nowrap; }

section.key .sh{ border-top-color:var(--accent); border-top-width:2px; }
.mark{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); padding:3px 8px; white-space:nowrap;
}

/* ---------- fields ---------- */
.f{ margin:var(--sp-4) 0 0; max-width:60ch; }
.q{
    font-family:var(--serif); font-variation-settings:'opsz' 20; font-weight:400;
    font-size:var(--s-lg); line-height:1.4; display:block; margin:0 0 var(--sp-1); color:var(--ink);
}
.q em{ font-style:italic; }
.hint{ font-family:var(--mono); font-size:var(--s-sm); line-height:1.65; color:var(--muted); margin:0 0 11px; }
.hint.flag{ color:var(--flag); background:var(--flag-soft); padding:10px 12px; }

.tag{
    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    vertical-align:3px; margin-left:9px; padding:2px 6px;
    border:1px solid var(--rule); color:var(--faint); white-space:nowrap;
}
.tag.req{ color:var(--accent); border-color:var(--accent); }

input[type=text], input[type=email], input[type=url], input[type=tel], textarea{
    width:100%; display:block;
    font-family:var(--sans); font-size:var(--s-base); line-height:1.6; color:var(--ink);
    background:var(--sheet); border:1px solid var(--rule); border-radius:0;
    padding:13px 15px;
    transition:border-color .15s ease, box-shadow .15s ease;
}
@media (prefers-reduced-motion: reduce){ input, textarea{ transition:none; } }
textarea{ min-height:112px; resize:vertical; }
textarea.tall{ min-height:184px; }
input:hover, textarea:hover{ border-color:var(--faint); }
input:focus-visible, textarea:focus-visible{
    outline:none; border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent);
}
.filled{ border-left:3px solid var(--ok); }

.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3); max-width:60ch; }
@media (max-width:620px){ .grid2{ grid-template-columns:1fr; } }

/* ---------- the photographs panel ---------- */
.drop{ margin:var(--sp-4) 0 0; padding:var(--sp-3) 22px; max-width:60ch; border:1px solid var(--accent); background:var(--accent-soft); }
.drop-h{ font-family:var(--serif); font-variation-settings:'opsz' 24; font-size:21px; margin:0 0 var(--sp-1); color:var(--ink); }
.drop-p{ font-family:var(--mono); font-size:var(--s-sm); line-height:1.7; color:var(--ink-2); margin:0 0 var(--sp-2); }
.drop p:last-child{ margin:0; }

/* ---------- sign off ---------- */
.finish{ max-width:60ch; border:1px solid var(--ink); background:var(--sheet); padding:var(--sp-4); margin:0 0 var(--sp-5); }
.finish h2{ margin:0 0 var(--sp-2); }
.finish p{ margin:0 0 var(--sp-3); color:var(--muted); font-size:var(--s-md); }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
button,.btn{
    font-family:var(--mono); font-size:13px; letter-spacing:.04em;
    padding:13px 20px; border-radius:0; cursor:pointer; text-decoration:none; display:inline-block;
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    transition:background .15s ease, color .15s ease;
}
/* In dark mode the accent becomes light, so the solid button needs dark
   text. Scoped to :not(.ghost): the un-scoped version won on specificity
   over button.ghost and painted the outline buttons near black on near
   black, at 1.03:1. */
:root[data-theme="dark"] button:not(.ghost), :root[data-theme="dark"] .btn:not(.ghost){ color:#12161E; }
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) button:not(.ghost),
    :root:not([data-theme="light"]) .btn:not(.ghost){ color:#12161E; }
}
button.ghost,.btn.ghost{ background:transparent; color:var(--accent); }
button:hover,.btn:hover{ background:var(--ink); border-color:var(--ink); color:var(--desk); }
button:focus-visible,.btn:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
.say{ font-family:var(--mono); font-size:var(--s-sm); color:var(--muted); flex:1 1 100%; margin:var(--sp-1) 0 0; min-height:18px; }
.say.good{ color:var(--ok); }
.say.bad{ color:var(--flag); }

.pill{
    position:fixed; right:clamp(14px,3vw,28px); bottom:clamp(14px,3vw,28px); z-index:70;
    opacity:0; pointer-events:none; transform:translateY(6px);
    transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 2px 14px rgba(20,19,15,.18);
}
.pill.on{ opacity:1; pointer-events:auto; transform:none; }
@media (prefers-reduced-motion: reduce){ .pill{ transition:none; } }

/* ---------- colophon ---------- */
.colophon{ border-top:1px solid var(--rule); padding:var(--sp-4) 0 var(--sp-6); }
.colophon-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:var(--sp-4); }
.colophon p{ margin:var(--sp-1) 0 0; font-size:var(--s-sm); line-height:1.75; color:var(--muted); max-width:40ch; }
.colophon button{ margin-top:var(--sp-2); }

.boot{ max-width:56ch; margin:0 auto; padding:80px var(--gutter); font-family:var(--serif); font-size:20px; color:var(--muted); }

/* ==========================================================
   PRINT. She may want to fill this in on paper, or hand it to
   someone else to draft. Rail, buttons and progress go; every
   question keeps a ruled space to write in.
   ========================================================== */
@media print{
    :root{ --desk:#fff; --sheet:#fff; --ink:#000; --ink-2:#222; --muted:#333; --faint:#444;
           --rule:#999; --rule-fine:#ccc; --accent:#000; --accent-soft:#fff; --flag:#000; --flag-soft:#fff; }
    .head,.rail-desk,.jump,.pill,.finish .row,.colophon button{ display:none !important; }
    body{ font-size:11pt; }
    .shell{ grid-template-columns:1fr; }
    section{ page-break-inside:auto; padding-bottom:18pt; }
    .sh,.f{ page-break-inside:avoid; }
    h1{ font-size:32pt; }
    h2{ font-size:16pt; }
    .toc a{ padding:5px 0; }
    /* The typed input rules are set on input[type=...] which outranks a
       bare element selector, so the print sheet kept all four borders
       and printed boxes instead of ruled lines. */
    input[type=text],input[type=email],input[type=url],input[type=tel],textarea{
        border:0; border-bottom:1px solid #999; background:transparent; min-height:0; padding:2pt 0;
    }
    .filled{ border-left:0; }
    textarea{ height:64pt; }
    textarea.tall{ height:104pt; }
    .drop{ border:1px solid #000; }
    a[href^="http"]::after{ content:" (" attr(href) ")"; font-size:8pt; word-break:break-all; }
}
</style>

<div id="app"><p class="boot">Loading the questionnaire&hellip; if this message stays, JavaScript is switched off in this browser.</p></div>

<script>
(function(){
  "use strict";

  /* ==========================================================
     Static build for ranatahirbilal.github.io. No backend, no
     account, no cost: answers live in this browser until she
     copies them into a reply. Photographs travel as a shared
     folder link so nothing large goes through email.
     ========================================================== */

  var SECTIONS = [
    { n:'01', t:'The basics', sub:'Exactly as you want them printed. Spelling, middle initial, punctuation, all of it.', fields:[
      { id:'name',  q:'Your full name, as it should appear on the site', req:true, hint:'Include any suffix you use professionally &mdash; MD, RN, CFP, PhD, Esq.' },
      { id:'called', q:'What do people actually call you?', hint:'The name you’d use in a conversation. I use it in the running text so the site doesn’t read like a legal document.' },
      { id:'title', q:'Current title', req:true, hint:'Your real one, not a flattering version.', half:true },
      { id:'org',   q:'Organization', req:true, hint:'Full legal name if it differs from the trading name.', half:true },
      { id:'city',  q:'City and state', hint:'Where you work, not where you were born.', half:true },
      { id:'years', q:'Years in this field', hint:'A number, or the year you started. I will do the arithmetic and check it.', half:true },
      { id:'email', q:'Contact email for the site', hint:'This will be public. Use one you’re happy to publish.', half:true, type:'email' },
      { id:'phone', q:'Contact phone', opt:true, hint:'Leave blank if you’d rather not publish one.', half:true, type:'tel' },
      { id:'links', q:'Any existing links', area:true, hint:'Employer bio page, LinkedIn, professional directory, old site, anything at all. One per line. If there are none, write &ldquo;none&rdquo; &mdash; that tells me something too.' }
    ]},
    { n:'02', t:'The one-line answer', sub:'This becomes the first thing anyone reads. It is the hardest question here, so take a run at it and don’t polish.', fields:[
      { id:'oneline', q:'Someone at a party asks what you do. What do you actually say?', req:true, area:true, hint:'Not your job title. The sentence you say out loud.' },
      { id:'matter',  q:'And why does it matter?', area:true, hint:'What is different for someone because you did your job well?' }
    ]},
    { n:'03', t:'The work, now', sub:'What you’re responsible for today.', fields:[
      { id:'orgdoes',  q:'What does your organization do?', area:true, hint:'In plain words. Assume the reader has never heard of it.' },
      { id:'day',      q:'Walk me through a real working day.', req:true, area:true, tall:true, hint:'Concrete beats abstract. &ldquo;I start at 6:45 and take report on four patients&rdquo; is worth more than &ldquo;I provide patient-centred care.&rdquo;' },
      { id:'who',      q:'Who do you serve, and who hires you?', area:true, hint:'If people find you and reach out, say who they are and what they usually want.' },
      { id:'services', q:'List the specific things you do, as services.', area:true, hint:'One per line, three to six of them. These become the section the site is built around.' }
    ]},
    { n:'04', t:'How you got here', sub:'I build a real timeline, so I need years. An approximate year is fine if you say it’s approximate — a wrong exact year is not.', fields:[
      { id:'first', q:'Your first job, and what it taught you.', area:true, hint:'Including the ones that had nothing to do with this. Those are usually the interesting part.' },
      { id:'roles', q:'Every role since, in order.', req:true, area:true, tall:true, hint:'One per line, like this &mdash; <b>2011&ndash;2016 &middot; Staff Nurse &middot; St Luke’s, Houston &middot; night shift, cardiac floor.</b> Gaps are fine; say what you were doing.' },
      { id:'turn',  q:'Was there a turning point?', area:true, hint:'A moment, a decision, a person, a bad year. The thing that made the path bend.' }
    ]},
    { n:'05', t:'Education and credentials', sub:'I print these exactly. Nothing goes on the site that you haven’t written here.', fields:[
      { id:'edu',     q:'Degrees and institutions, with years.', area:true, hint:'One per line &mdash; <b>2009 &middot; BSN &middot; University of Texas at Austin.</b> Include honours only if they were formally awarded.' },
      { id:'licence', q:'Licences and certifications, with the issuing body.', area:true, hint:'One per line, with the year and, if it applies, the state or jurisdiction and whether it’s current.' },
      { id:'member',  q:'Professional memberships and boards.', area:true, hint:'Organization, your role in it, and the years.' }
    ]},
    { n:'06', t:'Recognition', sub:'Only if it genuinely happened.', fields:[
      { id:'awards', q:'Awards, honours and listings.', area:true, tall:true, flag:true, hint:'I need three things for each or I cannot publish it: the exact name of the award, who gave it, and the year. &ldquo;Recognised in the industry&rdquo; is not something I can put on a website.' },
      { id:'press',  q:'Press, interviews, podcasts, panels.', area:true, hint:'Outlet, what it was, the date, and a link if one exists.' }
    ]},
    { n:'07', t:'Anything you’ve published', sub:'Books, papers, articles, courses, talks.', fields:[
      { id:'pub',      q:'Title, publisher, date.', area:true, tall:true, hint:'For a book, add the ISBN and where it can actually be bought. I will not put a &ldquo;Buy now&rdquo; button on the site unless it leads somewhere real &mdash; if it’s out of print or unavailable, say so and I will show that honestly instead.' },
      { id:'pubprice', q:'Current price and format, if it’s for sale.', area:true, hint:'Prices go stale fast. I would usually rather leave them off than print a wrong one &mdash; tell me what you’d prefer.' }
    ]},
    { n:'08', t:'What you actually think', sub:'This is the part that stops a personal site reading like a CV. Spend the most time here.', fields:[
      { id:'believe', q:'What do you believe about your work that not everyone in your field agrees with?', req:true, area:true, tall:true, hint:'Say the unfashionable version. I can soften it later if you want.' },
      { id:'mistake', q:'What is the most expensive mistake you see people make?', area:true, hint:'Clients, patients, colleagues, whoever it applies to.' },
      { id:'advice',  q:'What would you tell someone starting out today?', area:true, hint:'Including what you’d tell them not to bother with.' }
    ]},
    { n:'09', t:'One story', sub:'If I get nothing else from this form, I want this.', fields:[
      { id:'story', q:'Tell me about one thing that happened.', req:true, area:true, tall:true, hint:'A day, a case, a client, a call, a decision. It does not have to be flattering and it does not have to have a neat ending. Change names or leave them out if you need to &mdash; and tell me if any detail must not be published.' },
      { id:'proud', q:'And what are you most proud of?', area:true, hint:'It doesn’t have to be the biggest thing. Often it isn’t.' }
    ]},
    { n:'10', t:'In your own words', fields:[
      { id:'quote', q:'Two or three sentences you’d be happy to see quoted verbatim.', area:true, tall:true, hint:'I will print these exactly as written, in quotation marks, attributed to you. Nothing else on the site will be presented as a direct quote from you.' }
    ]},
    { n:'11', t:'What other people say', fields:[
      { id:'testi',   q:'Testimonials, in full.', area:true, tall:true, flag:true, hint:'For each one: the exact words, the person’s name, and their role or relationship to you. I do not publish anonymous or paraphrased testimonials, and I do not split one person’s words across two names.' },
      { id:'testiok', q:'Do you have permission to publish each of these?', req:true, area:true, hint:'Name any you’re unsure about. I’ll leave those out until it’s confirmed.' }
    ]},
    { n:'12', t:'Photographs', sub:'A personal site with no picture of the person doesn’t work. This is the section people skip and then regret.',
      blurb: function(){
        return '<div class="drop"><p class="drop-h">Sending me your photographs</p>'
          + '<p class="drop-p">Put them in a Google Drive or Dropbox folder, or drop them into WeTransfer, '
          + 'and paste the link in the box below. That way there is no size limit and nothing gets squashed by email.</p>'
          + '<p class="drop-p"><b>Before you paste it:</b> open the link in a private or incognito window and check it '
          + 'actually opens. A Drive folder is set to &ldquo;Restricted&rdquo; by default, which means only you can see it. '
          + 'Change it to <b>Anyone with the link</b>, or I will not be able to open it.</p></div>';
      },
      fields:[
      { id:'photos',    q:'What photographs do you have?', req:true, area:true, hint:'List what exists, even roughly &mdash; a professional headshot, phone photos, photos from an event, an old ID badge photo. If the honest answer is &ldquo;almost nothing,&rdquo; say that; it changes how I build the site.' },
      { id:'photolink', q:'Paste the link to your photographs here.', req:true, area:true, flag:true,
        hint:'Check it opens in a private window first. If sharing is left on &ldquo;Restricted&rdquo; the link will not work for me. If you would rather email them, write &ldquo;by email&rdquo; here instead and send them as a reply.' },
      { id:'photoright',q:'Who took them, and may I publish them?', req:true, area:true, flag:true, hint:'If a photographer or your employer holds the rights, I need that cleared before it goes up. Tell me about any photo I must not use.' },
      { id:'photoai',   q:'May I create additional pictures of you for the site?', area:true, flag:true, hint:'Most sites need shots nobody has &mdash; you at work, in your own setting. Where no such photograph exists I can produce illustrated versions built from the photographs you send: pictures of you that no camera actually took. They are marked as illustrations in the footer so nobody is misled. I will not make a single one without your written yes here. Say yes, no, or ask me first.' }
    ]},
    { n:'13', t:'Lines I shouldn’t cross', fields:[
      { id:'no',     q:'What do you <em>not</em> want on this site?', req:true, area:true, hint:'Topics, a former employer, your home town, family, a period of your life, a photograph, your phone number. Anything. This is the most useful answer on the page.' },
      { id:'review', q:'Does anyone need to approve this before it goes live?', area:true, flag:true, hint:'Employer communications, a compliance officer, a licensing board, a publisher. If you’re a regulated professional the answer is usually yes. Tell me who and I will build to their timeline.' }
    ]},
    { n:'14', t:'Practical', fields:[
      { id:'when',   q:'When do you need it?', hint:'And what’s driving that date.', half:true },
      { id:'domain', q:'Do you own a domain?', hint:'Or should I host it for now and move it later.', half:true },
      { id:'like',   q:'Is there a website whose feel you like?', area:true, hint:'Any site at all, in any industry. Paste the address and say what you like about it. One line is enough.' },
      { id:'else',   q:'Anything I didn’t ask?', area:true, tall:true, hint:'This box is where the best material usually turns up.' }
    ]}
  ]

  /* The two sections that carry the site. Marked, never hidden. */
  var KEY = { '08':1, '09':1 };

  var ALL = [];
  SECTIONS.forEach(function(s){ s.fields.forEach(function(f){ ALL.push(f); }); });

  var DRAFT_KEY = 'rtb-intake-v1';
  var app = document.getElementById('app');
  var saveTimer = null;

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function strip(s){ return String(s).replace(/<[^>]*>/g, ''); }

  /* localStorage is a per-device convenience. Private windows and blocked
     site data throw on access, so every call is guarded and the page has to
     render correctly with nothing stored. */
  function get(k){ try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function set(k,v){ try { window.localStorage.setItem(k,v); return true; } catch (e) { return false; } }
  function del(k){ try { window.localStorage.removeItem(k); } catch (e) { /* nothing stored */ } }
  function loadDraft(){
    var raw = get(DRAFT_KEY);
    if (!raw) { return {}; }
    try { return JSON.parse(raw) || {}; } catch (e) { return {}; }
  }

  /* ---------- document ---------- */
  function render(){
    var seed = loadDraft();
    var h = '';

    h += '<div class="head"><div class="head-track"><div class="head-fill" id="fill"></div></div>'
       + '<div class="head-row label"><span><b id="done">0</b> of <b>' + ALL.length + '</b> answered</span>'
       + '<span id="saved">saved on this device</span></div></div>';

    /* --- front matter --- */
    h += '<div class="page"><header class="cover">'
       + '<div class="masthead"><span class="label">Rana Tahir Bilal</span>'
       + '<span class="label">Website intake</span></div>'
       + '<h1>Before I build your site, I need to hear it from you.</h1>'
       + '<p class="standfirst">There is very little about you online, which is a good problem: the site will be the first proper account of your work rather than a rehash of someone else’s. But it means I cannot write a word of it until you tell me.</p>'
       + '<p class="standfirst">Answer in whatever voice you actually speak in. <em>Fragments are fine. Long is better than short.</em> I will do the shaping.</p>'
       + '<dl class="spec">'
       + row('Sections', SECTIONS.length + ', numbered below')
       + row('Questions', ALL.length + ' in total, ' + ALL.filter(function(f){ return f.req; }).length + ' of them essential')
       + row('Time', 'About forty minutes, in as many sittings as you like')
       + row('Saving', 'Every answer is kept in this browser as you type')
       + row('Returning', 'Press Copy at the end and paste it into a reply to my email')
       + '</dl></header>';

    /* --- contents --- */
    h += '<nav class="contents" aria-label="Contents">'
       + '<p class="label contents-h">Contents</p><ol class="toc">';
    SECTIONS.forEach(function(s){
      h += '<li><a href="#s' + s.n + '"><span class="toc-n">' + s.n + '</span>'
         + '<span class="toc-t">' + esc(strip(s.t)) + '</span>'
         + '<span class="toc-c">' + s.fields.length + (KEY[s.n] ? ' · worth the time' : '') + '</span></a></li>';
    });
    h += '</ol></nav>';

    /* --- body --- */
    h += '<details class="jump label"><summary>Jump to a section</summary>' + railHTML('m') + '</details>';
    h += '<div class="shell"><nav class="rail rail-desk" aria-label="Sections">' + railHTML('d') + '</nav><div class="qs">';

    SECTIONS.forEach(function(s){
      var k = !!KEY[s.n];
      h += '<section id="s' + s.n + '"' + (k ? ' class="key"' : '') + '>'
         + '<div class="sh"><div class="sh-row">'
         + '<span class="label">§ ' + s.n + '</span>'
         + (k ? '<span class="mark">Worth the time</span>'
              : '<span class="label sh-count" id="c-' + s.n + '">0 / ' + s.fields.length + '</span>')
         + '</div><h2>' + s.t + '</h2>'
         + (s.sub ? '<p class="sh-sub">' + s.sub + '</p>' : '')
         + '</div>';
      if (s.blurb) { h += s.blurb(); }
      var i = 0;
      while (i < s.fields.length) {
        var f = s.fields[i];
        if (f.half && s.fields[i+1] && s.fields[i+1].half) {
          h += '<div class="grid2">' + field(f, seed) + field(s.fields[i+1], seed) + '</div>';
          i += 2;
        } else { h += field(f, seed); i += 1; }
      }
      h += '</section>';
    });

    h += '<div class="finish"><h2>That is everything.</h2>'
       + '<p>Press Copy, then paste it straight into a reply to my email. If anything is still blank, send it anyway and I will ask.</p>'
       + '<div class="row"><button id="copy" type="button">Copy everything</button>'
       + '<a id="dl" class="btn ghost" download="website-intake.txt" href="#">Save as a file</a>'
       + '<p class="say" id="say" role="status" aria-live="polite"></p></div></div>';

    h += '</div></div>';

    /* --- colophon --- */
    h += '<footer class="colophon"><div class="colophon-grid">'
       + '<div><p class="label">Where your answers live</p><p>Only in this browser, on this device, until you copy them and send them yourself. Clearing your browser data clears them.</p></div>'
       + '<div><p class="label">What I will not do</p><p>Invent awards, dates, titles, quotes, publications or employment history, or round anything up. If a detail is missing I will ask again rather than guess.</p></div>'
       + '<div><p class="label">Starting over</p><p>This wipes every answer on this device and cannot be undone.</p>'
       + '<button id="clear" class="ghost" type="button">Clear the draft</button></div>'
       + '</div></footer></div>';

    h += '<button id="pill" class="pill" type="button">Copy everything</button>';

    app.innerHTML = h;
    wire();
  }

  function row(k, v){ return '<div><dt class="label">' + k + '</dt><dd>' + v + '</dd></div>'; }

  function railHTML(scope){
    var h = '<p class="label rail-h">The sections</p><ol>';
    SECTIONS.forEach(function(s){
      h += '<li id="r-' + scope + '-' + s.n + '"><a href="#s' + s.n + '">'
         + '<span class="dot" aria-hidden="true"></span>'
         + '<span><span class="rn">' + s.n + '</span> ' + esc(strip(s.t)) + '</span></a></li>';
    });
    return h + '</ol><p class="label rail-key">Ring, half, solid.<br>Nothing here is compulsory.</p>';
  }

  function field(f, seed){
    var v = seed && typeof seed[f.id] === 'string' ? seed[f.id] : '';
    var tag = f.req ? '<span class="tag req">Essential</span>' : (f.opt ? '<span class="tag">Optional</span>' : '');
    var control = f.area
      ? '<textarea id="f_' + f.id + '" data-f="' + f.id + '"' + (f.tall ? ' class="tall"' : '') + '>' + esc(v) + '</textarea>'
      : '<input type="' + (f.type || 'text') + '" id="f_' + f.id + '" data-f="' + f.id + '" value="' + esc(v) + '">';
    return '<div class="f"><label class="q" for="f_' + f.id + '">' + f.q + tag + '</label>'
      + (f.hint ? '<p class="hint' + (f.flag ? ' flag' : '') + '">' + f.hint + '</p>' : '')
      + control + '</div>';
  }

  /* ---------- behaviour ---------- */
  function collect(){
    var out = {};
    ALL.forEach(function(f){
      var el = document.getElementById('f_' + f.id);
      if (el && el.value.trim()) { out[f.id] = el.value.trim(); }
    });
    return out;
  }

  function wire(){
    var fill = document.getElementById('fill');
    var doneEl = document.getElementById('done');
    var savedEl = document.getElementById('saved');
    var pill = document.getElementById('pill');

    function progress(){
      var total = 0;
      SECTIONS.forEach(function(s){
        var n = 0;
        s.fields.forEach(function(f){
          var el = document.getElementById('f_' + f.id);
          if (!el) { return; }
          var has = el.value.trim().length > 0;
          if (has) { n++; total++; }
          el.classList.toggle('filled', has);
        });
        var state = n === 0 ? '' : (n === s.fields.length ? 'full' : 'part');
        ['d','m'].forEach(function(scope){
          var li = document.getElementById('r-' + scope + '-' + s.n);
          if (li) { li.className = state; }
        });
        var c = document.getElementById('c-' + s.n);
        if (c) { c.textContent = n + ' / ' + s.fields.length; }
      });
      doneEl.textContent = total;
      fill.style.width = (ALL.length ? (total / ALL.length) * 100 : 0) + '%';
      pill.classList.toggle('on', total > 0);
    }

    ALL.forEach(function(f){
      var el = document.getElementById('f_' + f.id);
      if (!el) { return; }
      el.addEventListener('input', function(){
        progress();
        window.clearTimeout(saveTimer);
        saveTimer = window.setTimeout(function(){
          /* Never write an empty draft over real answers if the form is gone. */
          if (!document.getElementById('f_name')) { return; }
          savedEl.textContent = set(DRAFT_KEY, JSON.stringify(collect()))
            ? 'saved on this device' : 'not saved, copy before you close';
        }, 400);
      });
    });

    progress();
    wireCopy();
    wireRail();

    document.getElementById('clear').addEventListener('click', function(){
      if (!window.confirm('Clear every answer on this device? This cannot be undone.')) { return; }
      ALL.forEach(function(f){
        var el = document.getElementById('f_' + f.id);
        if (el) { el.value = ''; }
      });
      del(DRAFT_KEY);
      progress();
      tell('Draft cleared.');
    });
  }

  function wireRail(){
    var jump = document.querySelector('.jump');
    if (jump) {
      jump.addEventListener('click', function(e){
        if (e.target.closest('a')) { jump.removeAttribute('open'); }
      });
    }
    if (!('IntersectionObserver' in window)) { return; }
    var current = null;
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) { return; }
        var n = e.target.id.slice(1);
        if (n === current) { return; }
        current = n;
        /* Clear once, then mark both rails. Clearing inside the loop wiped
           the desktop mark on the mobile pass. */
        var open = document.querySelectorAll('.rail a[aria-current]');
        Array.prototype.forEach.call(open, function(a){ a.removeAttribute('aria-current'); });
        ['d','m'].forEach(function(scope){
          var li = document.getElementById('r-' + scope + '-' + n);
          if (li) { li.querySelector('a').setAttribute('aria-current','true'); }
        });
      });
    }, { rootMargin:'-70px 0px -55% 0px', threshold:0 });
    SECTIONS.forEach(function(s){
      var el = document.getElementById('s' + s.n);
      if (el) { io.observe(el); }
    });
  }

  function wireCopy(){
    function text(){ return transcript(collect()); }
    function doCopy(){
      var t = text();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t)
          .then(function(){ tell('Copied. Now paste it into a reply to my email.', 'good'); })
          .catch(function(){ fallbackCopy(t); });
      } else { fallbackCopy(t); }
    }
    document.getElementById('copy').addEventListener('click', doCopy);
    document.getElementById('pill').addEventListener('click', function(){
      document.getElementById('copy').scrollIntoView({ block:'center' });
      doCopy();
    });
    var dl = document.getElementById('dl');
    dl.addEventListener('click', function(){
      /* Built at click time so the file always holds the latest answers. */
      var nm = (nameNow() || 'intake').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'intake';
      var blob = new Blob([text()], { type:'text/plain;charset=utf-8' });
      dl.href = URL.createObjectURL(blob);
      dl.download = nm + '-website-intake.txt';
      tell('Saved to your downloads.', 'good');
    });
  }

  function nameNow(){
    var el = document.getElementById('f_name');
    return el ? el.value.trim() : (loadDraft().name || '');
  }

  function fallbackCopy(t){
    var ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly','');
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    tell(ok ? 'Copied. Now paste it into a reply to my email.'
            : 'Copying was blocked by this browser. Use “Save as a file” instead.', ok ? 'good' : 'bad');
  }

  function transcript(answers){
    var out = ['WEBSITE INTAKE' + (answers.name ? ' — ' + answers.name : ''), ''];
    SECTIONS.forEach(function(s){
      out.push('');
      out.push('== ' + strip(s.t).toUpperCase() + ' ==');
      s.fields.forEach(function(f){
        out.push('');
        out.push(strip(f.q));
        out.push(answers[f.id] ? answers[f.id] : '(not answered)');
      });
    });
    return out.join('\n');
  }

  function tell(msg, kind){
    var say = document.getElementById('say');
    if (!say) { return; }
    say.textContent = msg;
    say.className = 'say' + (kind ? ' ' + kind : '');
  }

  render();
})();
</script>
